name: Feature Request
description: Request a new feature or a change to existing functionality.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: What do you want, and why
      description: Describe the request and the problem it solves.
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Module
      description: >
        Which existing module does this belong to (e.g. Personnel, Work Management, Fleet)? If
        it's a brand-new module with no ERD yet, say so - that needs to be scoped before a
        wireframe.
    validations:
      required: true

  - type: textarea
    id: wireframe
    attributes:
      label: Wireframe
      description: >
        Required for any new screen or a real change to an existing one. Upload it to
        m5x2-software-docs under architecture/<module>/wireframes/ (named to match this issue,
        e.g. issue-42-team-lead-badge.png) and link it here - or paste an image directly with
        drag-and-drop / Ctrl+V if it's simple enough to attach right in this box.
      placeholder: Link to the wireframe file in m5x2-software-docs, or pasted image.
    validations:
      required: true

  - type: textarea
    id: entities
    attributes:
      label: Existing entities involved
      description: >
        Check architecture/erd/particular/<module>.md in m5x2-software-docs for what already
        exists. List which tables/entities this touches, and call out anything new that isn't in
        the ERD yet.
      placeholder: |
        Existing: projects, phases
        New: nothing / a new "xyz" table for ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else worth knowing - who's asking, how urgent, related issues.
    validations:
      required: false
